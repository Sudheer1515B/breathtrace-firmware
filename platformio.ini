; BreathTrace firmware — ESP32-WROOM-32
; SIH 2026 · Problem Statement 26230

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit NeoPixel @ ^1.12.0

; TFT_eSPI is configured entirely through build flags so no library file has to
; be hand-edited. Pins must match include/config.h — see docs/PINOUT.md.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=13
    -DTFT_DC=14
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000

; Host-side unit tests for the pure-C++ classifier maths:
;   pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Iinclude
test_filter = test_classifier
